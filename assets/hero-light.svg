<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Moreblessing Martha Maposa: Analyse the problem. Build the fix.">
  <title>Moreblessing Martha Maposa: Analyse the problem. Build the fix.</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb59d"/>
      <stop offset="1" stop-color="#0f7a66"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="280" rx="14"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .r1{animation:rise .7s .05s both}.r2{animation:rise .7s .2s both}
    .r3{animation:rise .7s .35s both}.r4{animation:rise .7s .5s both}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow .8s .6s both}
    .dot{animation:pulse 2.2s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="#f7faf9"/>
    <text x="30" y="282" class="serif" font-size="130" font-weight="700" textLength="940" lengthAdjust="spacingAndGlyphs"
          fill="#0f7a66" opacity="0.06">MOREBLESSING</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="279" rx="13.5" fill="none" stroke="#d5e2df"/>

  <g class="r1">
    <rect x="48" y="38" width="38" height="38" rx="9" fill="url(#g)"/>
    <text x="67" y="63" text-anchor="middle" class="serif" font-size="18" font-weight="700" fill="#ffffff">MM</text>
    <text x="100" y="62" class="mono" font-size="12" letter-spacing="3" fill="#566b67">MOREBLESSING MARTHA MAPOSA</text>
  </g>

  <g class="r1">
    <circle class="dot" cx="640" cy="58" r="4" fill="#0f7a66"/>
    <text x="654" y="62" class="mono" font-size="12" letter-spacing="0.6" fill="#566b67">OPEN TO REMOTE ROLES AND CONSULTING</text>
  </g>

  <text class="serif r2" x="48" y="140" font-size="56" font-weight="700" fill="#0e1a18">Analyse the problem.</text>
  <text class="serif r3" x="48" y="202" font-size="56" font-weight="700" fill="#0f7a66">Build the fix.</text>
  <rect class="bar" x="48" y="218" width="64" height="3" rx="1.5" fill="#0f7a66"/>

  <text class="mono r4" x="48" y="252" font-size="15" fill="#566b67">Data Analyst · Business Analysis, Automation &amp; AI</text>
  <text class="mono r4" x="952" y="252" text-anchor="end" font-size="12" fill="#566b67">Harare, Zimbabwe · CAT (UTC+2)</text>
</svg>
